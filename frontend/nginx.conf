server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 关键：通过 Docker 内嵌 DNS 在“请求时”解析 api 主机名。
    # 若使用 proxy_pass http://api:8000 字面量，nginx 只会在启动时解析一次，
    # 此时 api 容器尚未注册到网络 DNS，nginx 会以
    # "host not found in upstream" 直接退出，web 随之一直不健康。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # proxy_pass 使用变量才会走上面的 resolver 做运行时解析；
        # api 暂时不可达时返回 502 并自动恢复，不影响静态页面。
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
